approvedGitRepositories:
  - "**"

enableScripts: true

enableTelemetry: false

logFilters:
  - code: YN0000
    level: discard
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard

nodeLinker: pnp

npmMinimalAgeGate: 14

packageExtensions:
  "eslint-plugin-sonarjs@*":
    dependencies:
      ts-api-utils: "*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
